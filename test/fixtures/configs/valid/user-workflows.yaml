# A uses human decisions; B uses agents; C is valid but differs from software_dev@1.
# (US1 scenario 9, 10, 11).
version: 1
harnesses:
  claude: { cmd: claude, auth: subscription, pool: claude }
pools: { claude: 1 }
models:
  sonnet: { harness: claude, id: sonnet, tier: 2 }
roles:
  coder: { binding: [{ model: sonnet }] }
  fixer: { binding: [{ model: sonnet }] }
  reviewer: { permissions: read_only, binding: [{ model: sonnet }] }
  scout: { permissions: read_only, binding: [{ model: sonnet }] }
workflows:
  wf_a:
    base: software_dev@1
    decisions: { agent_question: human }
  wf_b:
    base: software_dev@1
    decisions: { agent_question: agent, missing_acceptance: agent_review }
  wf_c:
    start: code
    steps:
      code:
        kind: agent
        role: coder
        max_visits: 3
        on_exhausted: escalate
        next: { done: gates, needs_input: ask, needs_context: retry, blocked: escalate }
      gates:
        kind: gate
        run: [unit]
        required: [unit]
        max_visits: 3
        on_exhausted: escalate
        next: { pass: done, fail: code }
      done: { kind: complete }
profiles:
  prof_a: { workflow: wf_a }
  prof_b: { workflow: wf_b }
  prof_c: { workflow: wf_c }
