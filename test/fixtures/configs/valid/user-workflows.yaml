# US1 scenario 10, 11.
version: 1
harnesses:
  claude: { cmd: claude, auth: subscription, pool: claude }
pools: { claude: 1 }
models:
  sonnet: { harness: claude, id: sonnet, tier: 2 }
roles:
  coder: { binding: [{ model: sonnet }] }
  fixer: { binding: [{ model: sonnet }] }
  reviewer: { permissions: read_only, binding: [{ model: sonnet }] }
  scout: { permissions: read_only, binding: [{ model: sonnet }] }
workflows:
  wf_a:
    base: software_dev@1
  wf_t:
    base: software_dev@1
    steps:
      code: { max_visits: 3, max_rung: 0 }
      gates: { run: [build, unit], required: [unit], max_visits: 4 }
      ci: { poll: 2m, timeout: 90m }
profiles:
  prof_a: { workflow: wf_a }
  prof_t: { workflow: wf_t }
