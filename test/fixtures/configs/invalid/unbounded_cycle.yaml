# expect: unbounded_cycle 25 34
version: 1
harnesses: { claude: { cmd: claude, auth: subscription, pool: claude } }
pools: { claude: 1 }
models: { sonnet: { harness: claude, id: sonnet, tier: 2 } }
roles:
  coder: { binding: [{ model: sonnet }] }
  fixer: { binding: [{ model: sonnet }] }
  reviewer: { permissions: read_only, binding: [{ model: sonnet }] }
  scout: { permissions: read_only, binding: [{ model: sonnet }] }
workflows:
  impl: { base: software_dev@1 }
  loop:
    start: code
    steps:
      code:
        kind: agent
        role: coder
        max_visits: 5
        on_exhausted: escalate
        next: { done: review, needs_input: ask, needs_context: retry, blocked: escalate }
      review:
        kind: review
        role: reviewer
        next: { approve: finish, request_changes: fix }
      fix:
        kind: agent
        role: fixer
        next: { done: review, needs_input: ask, needs_context: review, blocked: escalate }
      finish: { kind: complete }
profiles:
  standard: { workflow: impl }
