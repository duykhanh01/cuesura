# expect: unreachable_rung 12 11
version: 1
harnesses: { claude: { cmd: claude, auth: subscription, pool: claude } }
pools: { claude: 1 }
models: { sonnet: { harness: claude, id: sonnet, tier: 2 } }
roles:
  coder:
    binding: [{ model: sonnet }]
    escalation:
      ladder:
        - { effort: high }
        - { add_context: [scout_report] }
  fixer: { binding: [{ model: sonnet }] }
  reviewer: { permissions: read_only, binding: [{ model: sonnet }] }
  scout: { permissions: read_only, binding: [{ model: sonnet }] }
workflows:
  impl:
    base: software_dev@1
    steps:
      code: { max_visits: 4 }
profiles:
  standard: { workflow: impl }
