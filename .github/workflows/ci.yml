name: ci
on:
  pull_request:
    # closed chỉ để hủy run cũ của PR qua concurrency; mọi job bỏ qua sự kiện này.
    # Draft PRs (cusr keeps one a draft until its review approves) skip CI; ready_for_review runs it.
    types: [opened, synchronize, reopened, ready_for_review, closed]
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # build và test là check bắt buộc: PR chỉ sửa tài liệu vẫn có hai job này, ở trạng thái skipped.
  changes:
    if: github.event.action != 'closed' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Markdown ngoài src/ và test/ là tài liệu. Không đọc được danh sách file thì coi như có code.
        run: |
          if ! files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          code=$(printf '%s\n' "$files" | awk 'NF && (!/\.md$/ || /^(src|test)\//) { c = 1 } END { print c ? "true" : "false" }')
          echo "code=$code" >> "$GITHUB_OUTPUT"
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Native sandbox probes của harness cần bwrap/userns; đây không phải outer sandbox của Cuesura.
      - run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
      - run: pnpm test
