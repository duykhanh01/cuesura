version: 1
setup: 'pnpm install --frozen-lockfile'
# Gate `lint` của software_dev là tùy chọn, đỏ vẫn publish; typecheck và lint nằm trong gate bắt buộc.
gates:
  build: 'pnpm typecheck && pnpm build'
  unit: 'pnpm lint && pnpm test'
autofix:
  format_fix: 'pnpm format'
ci:
  required_checks: [build, test]
conventions: [AGENTS.md]
profile: dogfood
